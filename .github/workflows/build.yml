name: Build Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            variant: full
          - arch: arm64
            variant: full
          - arch: x64
            variant: lite
          - arch: arm64
            variant: lite
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare backend (${{ matrix.arch }} ${{ matrix.variant }})
        run: node scripts/prepare-backend.mjs --arch ${{ matrix.arch }}${{ matrix.variant == 'lite' && ' --no-node' || '' }}
        env:
          DSH_VERSION: 0.1.0-rc.6

      - name: Build installer (${{ matrix.arch }} ${{ matrix.variant }})
        shell: pwsh
        run: |
          if ("${{ matrix.variant }}" -eq "lite") {
            # 单引号：PowerShell 不做变量展开（${version} 等是 electron-builder 占位符，不是 PS 变量）
            npx electron-builder --win nsis --${{ matrix.arch }} --publish never `
              --config.win.artifactName='DeepSeek-Harness-Desktop-${version}-${arch}-lite.${ext}' `
              --config.portable.artifactName='DeepSeek-Harness-Desktop-${version}-${arch}-lite-portable.${ext}'
          } else {
            npx electron-builder --win nsis --${{ matrix.arch }} --publish never
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}-${{ matrix.variant }}
          path: release/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Setup Node.js (for latest.yml generation)
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate merged latest.yml (full before lite for arch matching)
        run: |
          cat > gen-latest.cjs <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const dir = 'artifacts';
          const files = fs.readdirSync(dir).filter(f => /^DeepSeek-Harness-Desktop-\d+\.\d+\.\d+-.*\.exe$/.test(f));
          if (files.length === 0) { console.error('no artifacts found'); process.exit(1); }
          // 排序：同架构内完整版在前（electron-updater 按 process.arch 命中第一个匹配项）
          const rank = (f) => (/arm64/.test(f) ? 2 : 0) + (/-lite\.exe$/.test(f) ? 1 : 0);
          files.sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
          const entry = (f) => {
            const buf = fs.readFileSync(path.join(dir, f));
            return '  - url: ' + f + '\n    sha512: ' + crypto.createHash('sha512').update(buf).digest('base64') + '\n    size: ' + buf.length;
          };
          const version = (files[0].match(/DeepSeek-Harness-Desktop-(\d+\.\d+\.\d+)/) || [])[1];
          const first = files[0];
          const sha512 = crypto.createHash('sha512').update(fs.readFileSync(path.join(dir, first))).digest('base64');
          const yml = 'version: ' + version + '\nfiles:\n' + files.map(entry).join('\n') + '\npath: ' + first + '\nsha512: ' + sha512 + '\nreleaseDate: ' + new Date().toISOString() + '\n';
          fs.writeFileSync(path.join(dir, 'latest.yml'), yml);
          console.log('latest.yml generated for version ' + version + ' with ' + files.length + ' artifacts');
          EOF
          node gen-latest.cjs

      - name: Cleanup stray release (electron-builder auto-publish leftovers)
        run: gh release delete "${{ github.ref_name }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}