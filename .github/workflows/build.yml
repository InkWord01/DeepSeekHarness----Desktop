name: Build Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            variant: full
          - arch: arm64
            variant: full
          - arch: x64
            variant: lite
          - arch: arm64
            variant: lite
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare backend (${{ matrix.arch }} ${{ matrix.variant }})
        run: node scripts/prepare-backend.mjs --arch ${{ matrix.arch }}${{ matrix.variant == 'lite' && ' --no-node' || '' }}
        env:
          DSH_VERSION: 0.1.0-rc.6

      - name: Build installer (${{ matrix.arch }} ${{ matrix.variant }})
        shell: pwsh
        run: |
          if ("${{ matrix.variant }}" -eq "lite") {
            # 单引号：PowerShell 不做变量展开（${version} 等是 electron-builder 占位符，不是 PS 变量）
            npx electron-builder --win nsis --${{ matrix.arch }} --publish never `
              --config.win.artifactName='DeepSeek-Harness-Desktop-${version}-${arch}-lite.${ext}' `
              --config.portable.artifactName='DeepSeek-Harness-Desktop-${version}-${arch}-lite-portable.${ext}'
          } else {
            npx electron-builder --win nsis --${{ matrix.arch }} --publish never
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}-${{ matrix.variant }}
          path: release/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Cleanup stray release (electron-builder auto-publish leftovers)
        run: gh release delete "${{ github.ref_name }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}